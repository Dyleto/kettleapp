# Ce qui doit tenir avant toute fusion.
#
# Rien ne gardait ce dépôt jusqu'ici : le banc de `verify/` — neuf suites dans
# un vrai navigateur — ne tournait que lorsque quelqu'un pensait à le lancer, et
# deux régressions ont atteint `develop` en une seule semaine faute de lui.
#
# Le banc est la raison d'être de ce fichier. Le typage, le lint et le
# formateur coûtent peu et attrapent des fautes de frappe ; le banc est ce qui
# attrape une séance qui cesse d'enregistrer, un bouton qui sort de l'écran,
# ou un repos qui cache le bloc. Les tests unitaires, eux, éprouvent ce que
# les fonctions décident, sur des cas qu'aucun écran n'atteint.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# Une nouvelle poussée rend l'exécution précédente sans objet : la seule
# réponse intéressante porte sur la tête courante.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Types, lint, format, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

      # La règle de langue, vérifiée plutôt que surveillée. Je l'ai annoncée
      # tenue trois fois sans qu'elle le soit : le détecteur que j'improvisais
      # avait chaque fois un angle mort. Voir scripts/audit-langue.mjs.
      - run: npm run lint:langue

  # La logique pure, sans navigateur : quelques secondes, et c'est là que se
  # décrivent les cas de bord qu'un écran n'atteint pas — une séance sans
  # bloc, deux bilans à la seconde près, une pyramide de treize paliers.
  unites:
    name: Les tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  bench:
    # Sans compte dans le nom : le lanceur découvre les suites du dossier,
    # et un nombre écrit ici se périmerait au premier ajout. Il l'a fait —
    # la tâche annonçait neuf suites en en lançant dix.
    name: Le banc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Installer les dépendances propres au banc
        working-directory: verify
        run: npm ci

      # `playwright-core` n'embarque aucun navigateur. On installe celui
      # qu'attend la version installée — lue dans le fichier de verrouillage
      # plutôt qu'épinglée ici, pour que les deux ne puissent jamais diverger.
      # Le banc le trouve ensuite seul : `CHROME_PATH` reste vide et
      # Playwright résout.
      #
      # La version sort dans sa propre étape parce que trois autres la lisent,
      # et qu'elle sert de clé de cache : la lire deux fois serait l'occasion
      # de la lire différemment.
      - name: La version de navigateur attendue
        id: browser
        working-directory: verify
        run: |
          echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      # Le navigateur pèse environ 150 Mo et était retéléchargé à chaque
      # exécution. Mesuré : cette étape prenait 23 à 33 s le 24 octobre, puis
      # 613 et 842 s le 26, sans qu'on y ait touché. La clé porte la version
      # exacte et aucune clé de repli : un navigateur d'une autre version ne
      # servirait à rien, et un cache partiel laisserait croire qu'il sert.
      - name: Le navigateur, s'il est déjà connu
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.browser.outputs.version }}

      # Deux étapes exclusives plutôt qu'une, et c'est voulu : le
      # téléchargement du navigateur et l'`apt-get` de `--with-deps` étaient
      # comptés ensemble, donc on ne pouvait pas savoir lequel avait ralenti
      # d'un facteur trente. Séparés, le minutage de la prochaine exécution le
      # dira de lui-même.
      - name: Installer Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: verify
        run: npx --yes "playwright@${{ steps.browser.outputs.version }}" install --with-deps chromium

      # Les bibliothèques système ne sont pas dans le cache — elles
      # s'installent hors du dossier mis en cache. Quand le navigateur est
      # déjà là, il reste donc à s'assurer qu'elles y sont.
      - name: Les bibliothèques système du navigateur
        if: steps.browser-cache.outputs.cache-hit == 'true'
        working-directory: verify
        run: npx --yes "playwright@${{ steps.browser.outputs.version }}" install-deps chromium

      # Le banc mène le vrai front contre l'API en mémoire que
      # `verify/mock-server.mjs` sert sur le port 3001. Aucune base de données
      # nulle part.
      - name: Pointer le front vers l'API d'essai
        run: |
          echo 'VITE_API_URL=http://localhost:3001' > .env
          echo 'VITE_GOOGLE_CLIENT_ID=test' >> .env

      - name: Démarrer le front
        run: |
          npx vite --port 5173 > vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5173 && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:5173

      - name: Lancer toutes les suites
        run: npm run verify

      - name: Le journal du front, quand quelque chose a échoué
        if: failure()
        run: tail -60 vite.log
