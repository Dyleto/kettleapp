# Ce qui doit tenir avant toute fusion.
#
# Rien ne gardait ce dépôt jusqu'ici : le banc de `verif/` — dix suites,
# 169 assertions — ne tournait que lorsque quelqu'un pensait à le lancer, et
# deux régressions ont atteint `develop` en une seule semaine faute de lui.
#
# Le banc est la raison d'être de ce fichier. Le typage, le lint et le
# formateur coûtent peu et attrapent des fautes de frappe ; le banc est ce qui
# attrape une séance qui cesse d'enregistrer, un bouton qui sort de l'écran,
# ou un repos qui cache le bloc.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

# Une nouvelle poussée rend l'exécution précédente sans objet : la seule
# réponse intéressante porte sur la tête courante.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Types, lint, format, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build

  bench:
    name: Le banc (10 suites)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Installer les dépendances propres au banc
        working-directory: verif
        run: npm ci

      # `playwright-core` n'embarque aucun navigateur. On installe celui
      # qu'attend la version installée — lue dans le fichier de verrouillage
      # plutôt qu'épinglée ici, pour que les deux ne puissent jamais diverger.
      # Le banc le trouve ensuite seul : `CHROME_PATH` reste vide et
      # Playwright résout.
      - name: Installer Chromium
        working-directory: verif
        run: |
          VERSION=$(node -p "require('playwright-core/package.json').version")
          npx --yes "playwright@$VERSION" install --with-deps chromium

      # Le banc mène le vrai front contre l'API en mémoire que
      # `verif/mock-server.mjs` sert sur le port 3001. Aucune base de données
      # nulle part.
      - name: Pointer le front vers l'API d'essai
        run: |
          echo 'VITE_API_URL=http://localhost:3001' > .env
          echo 'VITE_GOOGLE_CLIENT_ID=test' >> .env

      - name: Démarrer le front
        run: |
          npx vite --port 5173 > vite.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5173 && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:5173

      - name: Lancer toutes les suites
        run: npm run verify

      - name: Le journal du front, quand quelque chose a échoué
        if: failure()
        run: tail -60 vite.log
